# Deploys the Worker (API + frontend + exercise media, one origin) on merge to main.
# The recipe is the one docs/CLOUDFLARE_WORKERS_PORT.md and the workers commit message
# describe: build the frontend, stage the catalogue media next to it, wrangler deploy.
#
# Repo secrets this needs (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" template, or a custom token with
#                            Account · Workers Scripts : Edit (covers Durable Objects,
#                            migrations and the assets upload)
#   CLOUDFLARE_ACCOUNT_ID  — the account id (dashboard right sidebar)
# The Google OAuth client secret is NOT needed here: it lives in the Worker as a
# `wrangler secret put` value and survives every deploy.
name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'catalogue/media/**'
      - 'scripts/catalogue/stage-media.mjs'
      - '.github/workflows/workers-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # The 180 px stills and clips (catalogue/media, in git) ship as the Worker's own
      # static assets — same origin, no CDN. No VITE_IMG_BASE/VITE_GIF_BASE: the plain
      # build serves them from /exercise-media/.
      - run: node scripts/catalogue/stage-media.mjs frontend/dist
      - run: npm ci
        working-directory: workers
      - run: npx wrangler deploy
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A read-only probe, deliberately NOT the smoke test: that one registers profiles,
      # and against the deployed instance it would leave a junk user behind on every deploy.
      - run: curl -fsS https://gym.rin2401.workers.dev/api/health && curl -fsS https://gym.rin2401.workers.dev/api/config
